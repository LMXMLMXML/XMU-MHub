name: 发布桌面版

# 打一个 v* 的 tag 并推送，就会自动打包 Windows 绿色版并挂到 Release 上。
#   git tag v1.0.0
#   git push origin v1.0.0
#
# 只发布绿色版（onedir）。单文件版故意不发：PyInstaller 单文件会自解压到临时目录，
# 杀毒软件误报率高，且 README 里注明它"未在本机验证"，交付一律用绿色版。

on:
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限；GITHUB_TOKEN 由 Actions 自动提供，不用你配任何密钥
permissions:
  contents: write

jobs:
  build:
    # 产物是 Windows exe，必须在 windows runner 上构建
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          # 与应用要求一致（app.py 只用标准库，3.10+ 均可）
          python-version: '3.12'

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # 注意：--add-data 必须用反斜杠的绝对路径。
      # 用了 --specpath 之后，相对路径会按 spec 文件所在目录解析，会报
      # "Unable to find ...\web"。这一点 README 的「自己重新打包」里也写了。
      - name: 打包绿色版（onedir）
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          New-Item -ItemType Directory -Force -Path "$repo\.build\work2", "$repo\.build", "$repo\dist" | Out-Null
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --icon "$repo\web\assets\logo\app.ico" `
            --name "厦大统一门户-绿色版" `
            --workpath "$repo\.build\work2" `
            --specpath "$repo\.build" `
            --distpath "$repo\dist" `
            --add-data "$repo\web;web" `
            --add-data "$repo\data;data" `
            "$repo\app.py"

      - name: 检查产物
        shell: pwsh
        run: |
          $app = "dist\厦大统一门户-绿色版"
          if (-not (Test-Path "$app\厦大统一门户-绿色版.exe")) {
            throw "没有生成 exe，打包失败"
          }
          foreach ($f in @("_internal\python312.dll", "_internal\data\portal.json", "_internal\web\app.js")) {
            if (-not (Test-Path "$app\$f")) { throw "产物缺少关键文件: $f" }
          }
          $files = Get-ChildItem $app -Recurse -File
          $mb = [math]::Round((($files | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "产物 $($files.Count) 个文件，$mb MB"

      # 用 Python 的 zipfile 而不是 Compress-Archive：
      #   - Windows PowerShell 5.1 的 Compress-Archive 用系统 ANSI 代码页写条目名，
      #     中文 exe 名会变乱码
      #   - zipfile 默认对非 ASCII 名置 UTF-8 标志位（bit 11），解压端能正确还原
      # 脚本本身会自检这个标志位，所以解压乱码这类问题不会悄悄溜过去。
      #
      # PYTHONIOENCODING 必须设：runner 上 Python 的 stdout 默认是 cp1252，
      # 打印中文会 UnicodeEncodeError 直接以退出码 1 结束（脚本里也有兜底，
      # 双保险）。第一次跑就是因为这个失败在"压缩为 zip"这一步。
      # 资产名只用 ASCII。
      # 试过中文名（厦大统一门户-v1.0.1.zip）：python 侧创建成功，但 gh 上传时
      # 中文被吃掉，资产变成 "-v1.0.1.zip"，下载链接直接坏掉。
      # GitHub 对 asset 名本来就有字符集限制，Windows runner 的控制台编码又是
      # 一层不确定，所以文件名朴素一点没关系，能下就行 —— 中文说明放在
      # Release 正文和 README 里。
      - name: 压缩为 zip
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ver = "${{ github.ref_name }}"
          $zip = "XMU-Hub-$ver-windows.zip"
          python .github/make_release_zip.py "dist\厦大统一门户-绿色版" $zip
          if ($LASTEXITCODE -ne 0) { throw "压缩脚本退出码 $LASTEXITCODE" }
          if (-not (Test-Path $zip)) { throw "压缩失败，没生成 $zip" }
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "zip: $zip ($mb MB)"
          # 断言文件名必须与预期完全一致，防止再出现被静默改写的情况
          $leaf = (Get-Item $zip).Name
          if ($leaf -ne $zip) { throw "压缩产物文件名不是 ASCII，得到 '$leaf'" }
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 用 runner 自带的 gh CLI 发布，避免再引入一个第三方 Action
      - name: 创建 Release 并上传
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ github.ref_name }}"
          # 单引号 here-string：内容原样保留，不做变量插值，避免 $ 被误展开
          $notes = @'
          ## 下载

          点下面 Assets 里的 **`XMU-Hub-vX.Y.Z-windows.zip`**（约 9 MB，Windows 免安装绿色版）。

          **下载完三步就能用：**

          1. 解压 zip（右键 → 全部解压缩）
          2. 进解压出来的文件夹，双击 **`厦大统一门户-绿色版.exe`**
          3. 首次运行若被 Windows 拦截，点「更多信息」→「仍要运行」

          - 无需安装 Python，无需管理员权限，不写注册表
          - 收藏 / 最近打开 / 搜索记录存在同目录 `data\userdata.json`，删掉整个文件夹就是卸载
          - 只支持 Windows，需要系统自带 Edge
          - 被拦截的原因是 exe 没有代码签名证书（签名要花钱），不是文件有问题

          ## 手机端

          同一份数据还有 PWA 版：手机浏览器打开后「添加到主屏幕」，就能像 App 一样全屏使用、断网也能翻目录。
          见仓库 README 的「手机端 / PWA」一节。

          ## 说明

          - 这是**绿色版**（onedir）。单文件版体积更小，但要自解压到临时目录，
            被杀毒软件误报的概率更高，因此不随 Release 发布。
          - 首次运行若被 Windows SmartScreen 拦下，点「更多信息」→「仍要运行」。
            原因是 exe 没有代码签名证书，不是文件本身有问题。
          '@
          gh release create $ver "$env:ZIP_NAME" --title "厦大统一门户 $ver" --notes $notes
